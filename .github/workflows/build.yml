name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

# 同一分支重复推送时取消上一次，避免排队
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 子模块是编译必需项：:material3 模块依赖 material-color-utilities。
      # 缺了会在 :material3:compileReleaseKotlin 报 Unresolved 'dynamiccolor'。
      - name: Verify submodule
        run: |
          set -e
          if [ ! -d material3/material-color-utilities ]; then
            echo "::error::material-color-utilities submodule 缺失"
            exit 1
          fi
          if [ -z "$(ls -A material3/material-color-utilities 2>/dev/null)" ]; then
            echo "::error::material-color-utilities submodule 是空目录（未递归拉取）"
            exit 1
          fi
          echo "submodule ok: $(git -C material3/material-color-utilities rev-parse --short HEAD)"

      # Android SDK + Gradle 缓存 + compileSdk 37.2 的平台包会吃掉大量空间，
      # 先清掉 runner 上与本项目无关的大件（.NET / Haskell / 浏览器驱动等）
      - name: Free disk space
        run: |
          echo "== before ==" && df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get -qq clean || true
          echo "== after ==" && df -h / | tail -1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 项目 compileSdk 为 37 (minorApiLevel 2)，runner 预装里没有，
      # 需要接受 license 让 AGP 自动下载缺失的平台包。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 注意：不要在这里传 android.aapt2FromMavenOverride。
      # 那是 Termux/aarch64 专用（换掉 x86_64 的 aapt2），在 x86_64 的 runner 上
      # 指向不存在路径会直接失败。CI 用 Maven 默认的 x86_64 aapt2 即可。
      - name: Build debug APK
        run: |
          ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace \
            --warning-mode=summary

      - name: List artifacts
        if: always()
        run: |
          echo "== APK =="
          ls -lh app/build/outputs/apk/github/debug/*.apk 2>/dev/null || echo "（无 APK）"
          echo "== 剩余空间 =="
          df -h / | tail -1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RikkaRP-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 失败时把关键错误摘出来，便于在 Actions 页面直接看到
      - name: Extract errors
        if: failure()
        run: |
          echo "== Kotlin / Gradle 错误摘要 =="
          grep -aoE "^e: .*" -r . --include=*.log 2>/dev/null | head -40 || true
          echo "（完整日志见上方 build 步骤）"
