name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 子模块是编译必需项：:material3 依赖 material-color-utilities。
      # 缺了会在 :material3:compileReleaseKotlin 报 Unresolved 'dynamiccolor'。
      - name: Verify submodule
        run: |
          set -e
          if [ ! -d material3/material-color-utilities ]; then
            echo "::error::material-color-utilities submodule 缺失"
            exit 1
          fi
          if [ -z "$(ls -A material3/material-color-utilities 2>/dev/null)" ]; then
            echo "::error::material-color-utilities submodule 是空目录（未递归拉取）"
            exit 1
          fi
          echo "submodule ok: $(git -C material3/material-color-utilities rev-parse --short HEAD)"

      # Gradle 缓存 + Android SDK + compileSdk 37.2 平台包都吃空间，先腾地方
      - name: Free disk space
        run: |
          echo "== before ==" && df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images || true
          sudo apt-get -qq clean || true
          echo "== after ==" && df -h / | tail -1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：
      # 它内部执行 `sdkmanager tools`，而新版 cmdline-tools 已移除 "tools" 包，
      # 实测直接报 "Warning: Failed to find package 'tools'" 并 exit 1 让整个 job 失败。
      # ubuntu-latest 的 runner 已预装 Android SDK，只需接受 license，
      # 之后由 AGP 自动下载缺失的 platforms;android-37.2 等包。
      - name: Accept Android SDK licenses
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "== 预装内容 =="
          ls "$SDK" || true
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          echo "== 已接受的 license =="
          ls "$SDK/licenses" 2>/dev/null || true
          echo "== 已安装 platforms =="
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 注意：不要传 android.aapt2FromMavenOverride。
      # 那是 Termux/aarch64 专用（替换 x86_64 的 aapt2），在 x86_64 runner 上
      # 指向不存在的路径会直接失败。CI 用 Maven 默认的 x86_64 aapt2。
      - name: Build debug APK
        run: |
          ./gradlew :app:assembleGithubDebug \
            --parallel \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"

      - name: List artifacts
        if: always()
        run: |
          echo "== APK =="
          ls -lh app/build/outputs/apk/github/debug/*.apk 2>/dev/null || echo "（无 APK）"
          echo "== 剩余空间 =="
          df -h / | tail -1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RikkaRP-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
